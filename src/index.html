<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン | Growth Daily Report</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="center-screen">
    <main class="card login-card">
      <h1 class="logo">Growth Daily Report</h1>
      <p class="lead">日報で、内省と成長を習慣に。</p>

      <button type="button" class="btn btn-google" id="google-btn" disabled>
        <!-- Google の G マーク（外部読み込みを避けるためインラインSVG） -->
        <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
          <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
          <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
        </svg>
        <span>（社内用）Googleでログイン</span>
      </button>

      <p class="login-note">社内のGoogleアカウントでログインしてください。</p>

      <div class="login-divider"><span>または</span></div>

      <!-- 社外の方向け。Supabase Auth にメール/パスワードで登録したデモ用アカウント -->
      <section class="login-demo">
        <h2 class="login-demo-title">（社外用）デモアカウントでログイン</h2>

        <form id="password-form" novalidate>
          <label class="field">
            <span class="field-label">メールアドレス</span>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="demo@example.com"
            />
          </label>

          <label class="field">
            <span class="field-label">パスワード</span>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="パスワード"
            />
          </label>

          <button type="submit" class="btn btn-secondary" id="password-btn" disabled>
            ログイン
          </button>
        </form>
      </section>

      <p id="message" class="message" role="status">確認中...</p>
    </main>

    <script type="module" src="login.js"></script>
  </body>
</html>
